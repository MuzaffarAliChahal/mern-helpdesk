  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M320 378 H440"/>
    <path d="M840 290 H930"/>
  </g>
  <text x="380" y="366" fill="#64748b" font-size="13" text-anchor="middle">/api · JSON</text>
  <text x="885" y="278" fill="#64748b" font-size="13" text-anchor="middle">Mongoose</text>
  <text x="60" y="490" fill="#94a3b8" font-size="15">Muzaffar Ali Hakim · Open-source MERN project · GitHub</text>
