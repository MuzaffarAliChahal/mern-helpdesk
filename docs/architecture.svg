<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="60" y="64" fill="#0f172a" font-size="32" font-weight="700">Helpdesk Ticketing (MERN)</text>
  <text x="60" y="96" fill="#64748b" font-size="18">React SPA, Express REST API with JWT roles, MongoDB</text>
  <g font-size="17" text-anchor="middle">
    <rect x="50" y="140" width="300" height="300" rx="14" fill="#f0fdfa" stroke="#14b8a6" stroke-dasharray="6 5"/>
    <text x="70" y="168" text-anchor="start" fill="#0f766e" font-size="14" font-weight="600" letter-spacing="2">REACT 18 · VITE</text>
    <rect x="80" y="186" width="240" height="64" rx="10" fill="#fff" stroke="#0d9488" stroke-width="2"/>
    <text x="200" y="214" font-weight="600" fill="#134e4a">Pages</text>
    <text x="200" y="236" fill="#0f766e" font-size="14">Login · Queue · Ticket · New</text>
    <rect x="80" y="266" width="240" height="64" rx="10" fill="#fff" stroke="#0d9488" stroke-width="2"/>
    <text x="200" y="294" font-weight="600" fill="#134e4a">AuthContext</text>
    <text x="200" y="316" fill="#0f766e" font-size="14">JWT · auto sign-out on 401</text>
    <rect x="80" y="346" width="240" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="200" y="374" font-weight="600" fill="#1e3a8a">API client</text>
    <text x="200" y="396" fill="#1e40af" font-size="14">fetch · field errors</text>

    <rect x="440" y="140" width="400" height="300" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 5"/>
    <text x="460" y="168" text-anchor="start" fill="#475569" font-size="14" font-weight="600" letter-spacing="2">EXPRESS · NODE.JS 22</text>
    <rect x="470" y="186" width="340" height="64" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <text x="640" y="214" font-weight="600" fill="#14532d">helmet · CORS · rate limit</text>
    <text x="640" y="236" fill="#166534" font-size="14">requireAuth (JWT) · requireRole('agent')</text>
    <rect x="470" y="266" width="340" height="64" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <text x="640" y="294" font-weight="600" fill="#4c1d95">Routes + zod validation</text>
    <text x="640" y="316" fill="#5b21b6" font-size="14">/auth · /tickets · /tickets/:id/comments · /stats</text>
    <rect x="470" y="346" width="340" height="64" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
    <text x="640" y="374" font-weight="600" fill="#7f1d1d">Error handler</text>
    <text x="640" y="396" fill="#991b1b" font-size="14">one JSON shape: { error, details }</text>

    <rect x="930" y="140" width="220" height="300" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-dasharray="6 5"/>
    <text x="950" y="168" text-anchor="start" fill="#15803d" font-size="14" font-weight="600" letter-spacing="2">MONGODB 7</text>
    <rect x="955" y="196" width="170" height="70" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <text x="1040" y="226" font-weight="600" fill="#14532d">users</text>
    <text x="1040" y="248" fill="#166534" font-size="14">bcrypt hash · role</text>
    <rect x="955" y="290" width="170" height="90" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <text x="1040" y="320" font-weight="600" fill="#14532d">tickets</text>
    <text x="1040" y="342" fill="#166534" font-size="14">embedded comments</text>
    <text x="1040" y="362" fill="#166534" font-size="14">compound indexes</text>
